[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryomodel"
version = "0.1.0"
description = "Unified cryo-EM modeling toolkit"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "mrcfile",
  "gemmi>=0.6.5",
  "scikit-learn",
  "scikit-image",
  "typer",
  "matplotlib",
  "pandas",
  "pyyaml",
  "tqdm",
  "fastapi",
  "uvicorn",
]
[project.optional-dependencies]
ml = ["torch"]
pathwalk = ["ortools"]

[project.scripts]
cryomodel = "cryomodel.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryomodel*", "crymodel"]
exclude = ["tests*", "examples*", "outputs*", "chimerax-bundles*", "docs*", "data*"]

[tool.setuptools.package-data]
cryomodel = [
  "mutate/data/templates/*.pdb",
  "data/benchmark_data.json",
  "data/monomers/*.cif",
  "data/basehunter/NEW-DNA-TEMPLATES/*",
]
